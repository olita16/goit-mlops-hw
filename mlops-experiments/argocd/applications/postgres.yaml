apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres-mlflow
  namespace: infra-tools
spec:
  destination:
    namespace: mlflow
    server: https://kubernetes.default.svc

  project: default

  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: postgresql
    targetRevision: 12.5.6
    helm:
      valuesObject:
        global:
          security:
            allowInsecureImages: true

        image:
          registry: docker.io
          repository: bitnamilegacy/postgresql
          tag: 15.3.0-debian-11-r7

        auth:
          username: mlflow
          password: mlflowpass
          database: mlflow

        primary:
          persistence:
            enabled: false

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true