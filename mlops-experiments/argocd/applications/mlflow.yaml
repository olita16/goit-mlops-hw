apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlflow-experiments
  namespace: infra-tools
spec:
  project: default

  source:
    repoURL: https://community-charts.github.io/helm-charts
    chart: mlflow
    targetRevision: 1.6.2
    helm:
      releaseName: mlflow
      valuesObject:
        service:
          type: ClusterIP
          port: 5000

        auth:
          enabled: false

        postgresql:
          enabled: false

        extraEnvVarsCM: mlflow-env-config
        extraEnvVarsSecret: mlflow-env-secret

        extraArgs:
          backendStoreUri: "$(MLFLOW_BACKEND_STORE_URI)"
          defaultArtifactRoot: "$(MLFLOW_ARTIFACT_ROOT)"
          host: "0.0.0.0"
          port: "5000"
          workers: "1"

        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            cpu: 750m
            memory: 768Mi

        livenessProbe:
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5

        readinessProbe:
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5

  destination:
    namespace: mlflow
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true