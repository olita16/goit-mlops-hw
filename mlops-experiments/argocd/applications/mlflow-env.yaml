
apiVersion: v1
kind: ConfigMap
metadata:
  name: mlflow-env-config
  namespace: mlflow
data:
  MLFLOW_S3_ENDPOINT_URL: "http://minio-mlflow.mlflow.svc.cluster.local:9000"
  MLFLOW_BACKEND_STORE_URI: "postgresql://mlflow:mlflowpass@postgres-mlflow-postgresql.mlflow.svc.cluster.local:5432/mlflow"
  MLFLOW_ARTIFACT_ROOT: "s3://mlflow-artifacts"
---
apiVersion: v1
kind: Secret
metadata:
  name: mlflow-env-secret
  namespace: mlflow
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "minio"
  AWS_SECRET_ACCESS_KEY: "minio123"