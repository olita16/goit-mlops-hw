apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio-mlflow
  namespace: infra-tools
spec:
  destination:
    namespace: mlflow
    server: https://kubernetes.default.svc

  project: default

  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: minio
    targetRevision: 13.7.2
    helm:
      valuesObject:
        image:
          registry: docker.io
          repository: bitnamilegacy/minio

        auth:
          rootUser: minio
          rootPassword: minio123

        defaultBuckets: "mlflow-artifacts"

        service:
          type: ClusterIP

        persistence:
          enabled: false

        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 512Mi

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true